name: crm

services:
  app:
    container_name: crm_new_container
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/app.dockerfile
    image: crm-app
    volumes:
      - ./:/var/www/app
      # Named volume di-seed dari image (composer install / npm build) sehingga
      # bind-mount source di atas tidak menimpa vendor & hasil build dengan folder kosong.
      - vendor_volume:/var/www/app/vendor
      - build_volume:/var/www/app/public/build
    networks:
      - CrmNetwork
      # Network eksternal tempat container MySQL (krayin-mysql) berada.
      - crm_db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    container_name: crm_new_nginx
    image: nginx:1.19-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT_FORWARD:-8601}:80"
    volumes:
      - ./:/var/www/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      # nginx menyajikan file statis dari public/, jadi butuh hasil build juga.
      - build_volume:/var/www/app/public/build
    depends_on:
      app:
        condition: service_healthy
    networks:
      - CrmNetwork

networks:
  CrmNetwork:
    driver: bridge
  crm_db:
    name: crm
    external: true

volumes:
  vendor_volume:
  build_volume:
