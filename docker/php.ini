; Override PHP untuk container app (php-fpm)
; Selaras dengan client_max_body_size 100M di nginx, dan cegah OOM saat
; render full-page/SSR yang lebih berat -> menghindari worker mati (502).
memory_limit = 4G
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 600
max_input_time = 600
